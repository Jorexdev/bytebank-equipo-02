server:
  port: 8082

spring:
  application:
    name: ms-accounts
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/accounts_db}
    username: ${DB_USER:bytebank}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

bytebank:
  zone: Europe/Madrid
  jwt:
    secret: ${JWT_SECRET}
  internal-key: ${INTERNAL_KEY}
  services:
    auth-url: ${AUTH_URL:http://localhost:8081}
  outbox:
    relay-delay-ms: 1000
    batch-size: 100
    send-timeout-ms: 10000
    retention-days: 3
    cleanup-cron: "0 0 4 * * *"


management:
  endpoints:
    web:
      exposure:
        include: health
