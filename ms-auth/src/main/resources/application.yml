server:
  port: 8081

spring:
  application:
    name: ms-auth
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${DB_USER:bytebank}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

bytebank:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  internal-key: ${INTERNAL_KEY}
  # SEG-03: primer gestor de un entorno real. Sin valores por defecto: si no se indican, no se crea nada.
  bootstrap-gestor:
    email: ${BOOTSTRAP_GESTOR_EMAIL:}
    password: ${BOOTSTRAP_GESTOR_PASSWORD:}
    full-name: ${BOOTSTRAP_GESTOR_NAME:Gestor principal}

  security:
    public-paths:
      - /api/auth/register
      - /api/auth/login

management:
  endpoints:
    web:
      exposure:
        include: health
