name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Maven tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: ./mvnw -B -fae verify

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build microservices images
        run: |
          for module in \
            ms-gateway \
            ms-auth \
            ms-accounts \
            ms-transfers \
            ms-cards \
            ms-fraud \
            ms-notifications
          do
            echo "Building image for ${module}"
            docker buildx build \
              --load \
              --build-arg MODULE="${module}" \
              --tag "bytebank/${module}:ci" \
              .
          done
